name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes, so the macOS queue only builds the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: QuoteCraft/QuoteCraft.csproj

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        # The tests reference the app's desktop head; the override keeps restore away from the mobile workloads.
        run: dotnet test QuoteCraft.Tests/QuoteCraft.Tests.csproj -c Release -p:QuoteCraftTargetFrameworks=net10.0-desktop

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-desktop -c Release -r ${{ matrix.rid }} --self-contained -p:QuoteCraftTargetFrameworks=net10.0-desktop -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: quotecraft-desktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  wasm:
    name: WebAssembly
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install wasm-tools
        # SQLCipher and IDBFS are linked into dotnet.native.wasm, which needs the native toolchain.
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:QuoteCraftTargetFrameworks=net10.0-browserwasm -o publish/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: quotecraft-wasm
          path: publish/wasm/wwwroot

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install android workload
        run: dotnet workload install android
      - name: Restore signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quotecraft.keystore"
      - name: Publish (signed when the keystore secrets exist, debug-signed otherwise)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/quotecraft.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD"
          fi
          # One format per publish: a list value did not produce both packages.
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:QuoteCraftTargetFrameworks=net10.0-android -p:AndroidPackageFormat=aab $SIGN -o publish/android
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:QuoteCraftTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk $SIGN -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: quotecraft-android
          path: |
            publish/android/*.aab
            publish/android/*.apk

  android-emulator:
    name: Android (emulator smoke test)
    # Installs the APK the Android job built on an x86_64 emulator, launches it, and fails on a crash, a blank first
    # frame or a missing content marker. Evidence (screenshot, window dump, logcat, timing) is uploaded either way.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Per app. APP_PACKAGE is the csproj's ApplicationId. APP_ACTIVITY is the class marked [Activity(MainLauncher = true)]:
      # .NET for Android names it crc64<hash>.MainActivity unless the attribute sets Name, so the check resolves the
      # launcher and matches its class name (a fully qualified Java name is launched as given). APP_CONTENT_MARKER is a
      # regex for text the first screen shows, read from the accessibility tree (uiautomator dump); APP_LOGCAT_MARKER is
      # an optional regex the app's own logcat lines must contain.
      APP_PACKAGE: com.companyname.quotecraft
      APP_ACTIVITY: MainActivity
      # Onboarding's welcome heading. A fresh install opens onboarding (D4), with no sign-in (local-first, D3); App.OnLaunched
      # opens it after the shell's first navigation, once the database services have started; the splash, the loading
      # state and the start-up error screen never show this text.
      APP_CONTENT_MARKER: Welcome to QuoteCraft
      APP_LOGCAT_MARKER: ''
      APP_ARTIFACT: quotecraft-android
      APP_SETTLE_SECONDS: '20'
      APP_MARKER_TIMEOUT: '90'
      EMULATOR_API: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_PROFILE: pixel_6
    steps:
      - name: Record the job start
        run: date +%s > "$RUNNER_TEMP/smoke-job-start"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Restore and save are separate steps so a failing smoke test still caches the snapshot it booted from.
      - name: Restore the AVD snapshot
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-x86_64-${{ env.EMULATOR_PROFILE }}-v1
      - name: Create the AVD and its boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for the cache."
      - name: Save the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-x86_64-${{ env.EMULATOR_PROFILE }}-v1
      - name: Write the smoke script
        # The emulator runner runs each line of `script` in its own `sh -c`, so the checks live in one bash file.
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-bin"
          cat > "$RUNNER_TEMP/smoke-bin/window_nodes.py" <<'PY'
          """uiautomator window dump helper.
          list <dump> <package|*>: the named nodes (class, bounds, id, text), one per line.
          dismiss <dump> <package>: "x y" of a Wait/Close/OK button in another package's window (a system dialog), or nothing."""
          import re, sys, xml.etree.ElementTree as ET

          mode, path, pkg = sys.argv[1:4]
          try:
              nodes = list(ET.parse(path).getroot().iter("node"))
          except (OSError, ET.ParseError) as e:
              print(f"no readable window dump: {e}" if mode == "list" else "")
              sys.exit(0)
          if mode == "list":
              for n in nodes:
                  if pkg != "*" and n.get("package") != pkg:
                      continue
                  label = n.get("text") or n.get("content-desc") or ""
                  rid = n.get("resource-id", "").split("/")[-1]
                  if label or rid:
                      where = "" if pkg != "*" else n.get("package", "") + " "
                      print(f"{where}{n.get('class', '').split('.')[-1]:<13} {n.get('bounds', ''):<24} {rid:<15} {label[:100]}")
          else:
              for wanted in ("Wait", "Close app", "Close", "OK", "Dismiss"):
                  for n in nodes:
                      if n.get("package") != pkg and (n.get("text") or "").strip() == wanted and n.get("clickable") == "true":
                          x1, y1, x2, y2 = map(int, re.findall(r"\d+", n.get("bounds", "[0,0][0,0]")))
                          print((x1 + x2) // 2, (y1 + y2) // 2)
                          sys.exit(0)
          PY
          cat > "$RUNNER_TEMP/smoke-bin/screen_check.py" <<'PY'
          """Reads a raw `screencap` frame: writes metrics, prints a text thumbnail, and exits 1 when the frame is blank."""
          import json, struct, sys

          raw_path, out_dir = sys.argv[1], sys.argv[2]
          data = open(raw_path, "rb").read()
          w, h, fmt = struct.unpack_from("<III", data, 0)
          hdr = next((n for n in (16, 12) if len(data) - n == w * h * 4), None)
          if hdr is None:
              print(f"unexpected raw frame: {len(data)} bytes for {w}x{h} format {fmt}")
              sys.exit(2)
          px = memoryview(data)[hdr:]

          # Blank check on the band between the status bar and the navigation bar, every 4th pixel.
          n = 0; s = 0.0; s2 = 0.0; counts = {}
          for y in range(int(h * 0.08), int(h * 0.92), 4):
              row = y * w * 4
              for x in range(0, w, 4):
                  i = row + x * 4
                  r, g, b = px[i], px[i + 1], px[i + 2]
                  lum = 0.299 * r + 0.587 * g + 0.114 * b
                  n += 1; s += lum; s2 += lum * lum
                  key = (r >> 3, g >> 3, b >> 3)
                  counts[key] = counts.get(key, 0) + 1
          mean = s / n
          std = max(0.0, s2 / n - mean * mean) ** 0.5
          dominant = max(counts.values()) / n
          blank = std < 2.0 or dominant > 0.995
          metrics = {"width": w, "height": h, "luma_mean": round(mean, 2), "luma_std": round(std, 2),
                     "dominant_color_share": round(dominant, 4), "distinct_colors": len(counts), "blank": blank}
          json.dump(metrics, open(f"{out_dir}/screen-metrics.json", "w"), indent=2)
          print(json.dumps(metrics))

          # Text thumbnail of the whole frame, readable in the job log: each cell is its mean distance from the dominant
          # colour, so the background is blank in either theme and text, controls and drawings show as marks.
          bg = [(c << 3) + 4 for c in max(counts, key=counts.get)]
          cols = 54; rows = max(1, round(cols * h / w / 2)); cw = w / cols; ch = h / rows
          ramp = " .:-=+*#%@"
          lines = []
          for cy in range(rows):
              line = ""
              for cx in range(cols):
                  acc = 0; m = 0
                  for y in range(int(cy * ch), int((cy + 1) * ch), 4):
                      for x in range(int(cx * cw), int((cx + 1) * cw), 4):
                          i = (y * w + x) * 4
                          acc += abs(px[i] - bg[0]) + abs(px[i + 1] - bg[1]) + abs(px[i + 2] - bg[2])
                          m += 1
                  line += ramp[min(len(ramp) - 1, int(acc / max(m, 1) / 3 / 255 * (len(ramp) - 1) * 4))]
              lines.append(line)
          open(f"{out_dir}/thumbnail.txt", "w").write("\n".join(lines) + "\n")
          print(f"::group::Text thumbnail ({cols}x{rows} cells of {w}x{h})")
          print("+" + "-" * cols + "+")
          for line in lines:
              print("|" + line + "|")
          print("+" + "-" * cols + "+")
          print("::endgroup::")
          sys.exit(1 if blank else 0)
          PY
          cat > "$RUNNER_TEMP/smoke-bin/smoke.sh" <<'SH'
          #!/usr/bin/env bash
          # Runs inside the emulator runner once the emulator has booted; ANDROID_SERIAL names it.
          set -uo pipefail
          OUT="$RUNNER_TEMP/smoke"; BIN="$RUNNER_TEMP/smoke-bin"; PKG="$APP_PACKAGE"
          PKG_RE=$(printf '%s' "$PKG" | sed 's/\./\\./g')
          RESULTS=(); FAILED=0
          check() { # name, pass|fail, detail
            RESULTS+=("| $1 | $2 | $3 |")
            if [ "$2" = fail ]; then FAILED=1; echo "::error title=Android smoke: $1::$3"; else echo "PASS $1: $3"; fi
          }
          note() { echo "$1=$2" | tee -a "$OUT/timing.txt"; }
          now_ms() { date +%s%3N; }
          finish() {
            [ -n "${LOGCAT_PID:-}" ] && kill "$LOGCAT_PID" 2>/dev/null
            { echo "### Android emulator smoke test: $PKG"; echo; echo "| Check | Result | Detail |"; echo "|---|---|---|"
              printf '%s\n' "${RESULTS[@]}"; echo; echo '```'; cat "$OUT/timing.txt"; echo '```'; } > "$OUT/summary.md"
            cat "$OUT/summary.md"; cat "$OUT/summary.md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit "$FAILED"
          }

          note emulator_ready_after_job_start_s $(( $(date +%s) - $(cat "$RUNNER_TEMP/smoke-job-start") ))
          note device "$(adb shell getprop ro.product.model | tr -d '\r'), API $(adb shell getprop ro.build.version.sdk | tr -d '\r'), $(adb shell getprop ro.product.cpu.abi | tr -d '\r'), $(adb shell wm size | tr -d '\r' | tail -n 1)"

          # The APK: the signed one from the Android job's artifact, with x86_64 native code.
          APK=$(find "$GITHUB_WORKSPACE/apk" -name '*-Signed.apk' | head -n 1)
          [ -z "$APK" ] && APK=$(find "$GITHUB_WORKSPACE/apk" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then check "APK" fail "no .apk in the $APP_ARTIFACT artifact"; finish; fi
          ABIS=$(unzip -Z1 "$APK" 'lib/*' 2>/dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ')
          note apk "$(basename "$APK"), $(stat -c%s "$APK") bytes, ABIs: $ABIS"
          case " $ABIS " in *" x86_64 "*) check "APK has x86_64" pass "$ABIS" ;; *) check "APK has x86_64" fail "ABIs: $ABIS (RuntimeIdentifiers needs android-x64)"; finish ;; esac

          # Logcat from before the install to the end, streamed so nothing rotates out.
          adb logcat -c
          adb logcat -v threadtime > "$OUT/logcat-full.txt" 2>&1 &
          LOGCAT_PID=$!
          # A system process on the busy emulator can raise an ANR or crash dialog over the app (run 10: the dump held
          # only another package's 12 nodes for 90 s). Hide those dialogs; the app's own crashes and ANRs are still caught
          # from logcat and the process state below.
          adb shell settings put global hide_error_dialogs 1
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null 2>&1

          t=$(now_ms)
          if timeout 300 adb install -r -g "$APK" > "$OUT/install.txt" 2>&1; then
            note install_ms $(( $(now_ms) - t )); check "Install" pass "$(tail -n 1 "$OUT/install.txt" | tr -d '\r')"
          else
            check "Install" fail "$(tail -n 2 "$OUT/install.txt" | tr -d '\r' | tr '\n' ' ')"; finish
          fi

          # The launcher activity, matched against APP_ACTIVITY, then launched explicitly.
          LAUNCHER=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -n 1)
          note launcher "$LAUNCHER"
          case "$APP_ACTIVITY" in
            *.*) COMPONENT="$PKG/$APP_ACTIVITY" ;;
            *) if [ "${LAUNCHER%%/*}" = "$PKG" ] && [ "${LAUNCHER##*.}" = "$APP_ACTIVITY" ]; then COMPONENT="$LAUNCHER"
               else check "Launcher activity" fail "the launcher is '$LAUNCHER', not a class named $APP_ACTIVITY"; COMPONENT="$PKG/.$APP_ACTIVITY"; fi ;;
          esac
          LAUNCH_EPOCH=$(date +%s)
          adb shell am start -W -n "$COMPONENT" -a android.intent.action.MAIN -c android.intent.category.LAUNCHER 2>&1 | tr -d '\r' > "$OUT/am-start.txt"
          cat "$OUT/am-start.txt"
          # `am start -W` stops waiting after 10 s. A cold Uno start on the software-rendered emulator draws its first
          # frame later than that, so "Status: timeout" is not a failure; the checks below decide whether the app came up.
          STATUS=$(sed -n 's/^Status: //p' "$OUT/am-start.txt")
          note am_start "status ${STATUS:-none}, TotalTime $(sed -n 's/^TotalTime: //p' "$OUT/am-start.txt") ms, WaitTime $(sed -n 's/^WaitTime: //p' "$OUT/am-start.txt") ms"
          if [ -n "$STATUS" ] && ! grep -qi '^Error' "$OUT/am-start.txt"; then
            check "Launch" pass "$COMPONENT (am start: $STATUS)"
          else
            check "Launch" fail "$COMPONENT: $(grep -i -m 1 'error' "$OUT/am-start.txt")"
          fi

          # Content: the marker in the accessibility tree, polled until it shows or the timeout passes. When another
          # package's window is on top, it is logged once and dismissed (its Wait/Close/OK button, else CLOSE_SYSTEM_DIALOGS).
          FOUND=""; COVERED=0
          deadline=$(( LAUNCH_EPOCH + APP_MARKER_TIMEOUT ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            adb shell rm -f /sdcard/window.xml
            timeout 30 adb shell uiautomator dump /sdcard/window.xml > "$OUT/uiautomator.txt" 2>&1
            adb exec-out cat /sdcard/window.xml > "$OUT/window.xml" 2>/dev/null
            # Only the app's own nodes count, not the launcher's or a notification's.
            if [ -n "$APP_CONTENT_MARKER" ] && grep -oE '<node [^>]*>' "$OUT/window.xml" | grep -F "package=\"$PKG\"" | grep -qiE "$APP_CONTENT_MARKER"; then
              FOUND=$(( $(date +%s) - LAUNCH_EPOCH )); break
            fi
            [ -z "$APP_CONTENT_MARKER" ] && break
            # A failed dump leaves no <node> (exec-out returns cat's error text instead), which is not a covering window.
            if grep -q '<node ' "$OUT/window.xml" && ! grep -qF "package=\"$PKG\"" "$OUT/window.xml"; then
              COVERED=$(( COVERED + 1 ))
              if [ "$COVERED" -eq 1 ]; then
                cp "$OUT/window.xml" "$OUT/window-covering.xml"
                echo "::group::Window on top is not $PKG ($(( $(date +%s) - LAUNCH_EPOCH ))s after launch)"
                python3 -I "$BIN/window_nodes.py" list "$OUT/window.xml" '*'
                echo "::endgroup::"
              fi
              TAP=$(python3 -I "$BIN/window_nodes.py" dismiss "$OUT/window.xml" "$PKG")
              if [ -n "$TAP" ]; then echo "dismissing a dialog: tap $TAP"; adb shell input tap $TAP
              else adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null 2>&1; fi
            fi
            sleep 3
          done
          note window_covered_polls "$COVERED"
          note window_nodes "total $(grep -o '<node ' "$OUT/window.xml" | wc -l), app $(grep -o "package=\"$PKG\"" "$OUT/window.xml" | wc -l)"
          echo "::group::Window dump: the app's named nodes"
          python3 -I "$BIN/window_nodes.py" list "$OUT/window.xml" "$PKG" | tee "$OUT/window-nodes.txt"
          echo "::endgroup::"
          if [ -n "$APP_CONTENT_MARKER" ]; then
            if [ -n "$FOUND" ]; then note content_marker_after_launch_s "$FOUND"; check "Content marker (window dump)" pass "/$APP_CONTENT_MARKER/ after ${FOUND}s"
            else check "Content marker (window dump)" fail "/$APP_CONTENT_MARKER/ not in the window dump within ${APP_MARKER_TIMEOUT}s ($(tail -n 1 "$OUT/uiautomator.txt" | tr -d '\r'))"; fi
          fi

          # Settle, then: still running, still in front, and a frame that is not blank.
          elapsed=$(( $(date +%s) - LAUNCH_EPOCH ))
          [ "$elapsed" -lt "$APP_SETTLE_SECONDS" ] && sleep $(( APP_SETTLE_SECONDS - elapsed ))
          APP_PID=$(adb shell pidof "$PKG" | tr -d '\r')
          if [ -n "$APP_PID" ]; then check "Process alive" pass "pid $APP_PID, $(( $(date +%s) - LAUNCH_EPOCH ))s after launch"
          else check "Process alive" fail "$PKG is not running $(( $(date +%s) - LAUNCH_EPOCH ))s after launch"; fi
          RESUMED=$(adb shell dumpsys activity activities | tr -d '\r' | grep -m 1 -E 'topResumedActivity|mResumedActivity' | sed 's/^ *//')
          if echo "$RESUMED" | grep -q "$PKG/"; then check "In the foreground" pass "$RESUMED"; else check "In the foreground" fail "${RESUMED:-no resumed activity}"; fi
          note focused_window "$(adb shell dumpsys window | tr -d '\r' | grep -m 1 'mCurrentFocus' | sed 's/^ *//')"
          adb exec-out screencap -p > "$OUT/screenshot.png"
          adb exec-out screencap > "$OUT/screen.raw"
          if METRICS=$(python3 -I "$BIN/screen_check.py" "$OUT/screen.raw" "$OUT"); then R=pass; else R=fail; fi
          echo "$METRICS"
          check "First frame not blank" "$R" "$(echo "$METRICS" | head -n 1)"
          rm -f "$OUT/screen.raw"

          # Logcat: crashes and unhandled exceptions in the app's processes, or system lines naming the package.
          kill "$LOGCAT_PID" 2>/dev/null; wait "$LOGCAT_PID" 2>/dev/null; LOGCAT_PID=""
          PIDS=$( { grep -oE "Start proc [0-9]+:$PKG_RE/" "$OUT/logcat-full.txt" | sed -E 's/Start proc ([0-9]+):.*/\1/'; echo "$APP_PID"; } | grep . | sort -u | tr '\n' ' ')
          note app_pids "$PIDS"
          note first_frame_displayed "$(grep -m 1 -oE "Displayed $PKG_RE/[^ ]+( for user [0-9]+)?: \+[0-9a-z]+" "$OUT/logcat-full.txt" | sed 's/.*: +//')"
          awk -v pids=" $PIDS " 'index(pids, " " $3 " ") > 0' "$OUT/logcat-full.txt" > "$OUT/logcat-app.txt"
          { grep -E 'FATAL EXCEPTION|UNHANDLED EXCEPTION|[Uu]nhandled [Ee]xception|JavaProxyThrowable|Fatal signal' "$OUT/logcat-app.txt"
            grep -E "AndroidRuntime.*Process: $PKG_RE|>>> $PKG_RE <<<|Process $PKG_RE \(pid [0-9]+\) has died|ANR in $PKG_RE" "$OUT/logcat-full.txt"; } > "$OUT/logcat-crash.txt"
          note logcat_lines "full $(wc -l < "$OUT/logcat-full.txt"), app $(wc -l < "$OUT/logcat-app.txt"), crash $(wc -l < "$OUT/logcat-crash.txt")"
          if [ -s "$OUT/logcat-crash.txt" ]; then check "No crash in logcat" fail "$(head -n 1 "$OUT/logcat-crash.txt")"
          else check "No crash in logcat" pass "no FATAL EXCEPTION, unhandled exception, fatal signal or ANR for $PKG"; fi
          if [ -n "$APP_LOGCAT_MARKER" ]; then
            if grep -qE "$APP_LOGCAT_MARKER" "$OUT/logcat-app.txt"; then check "Logcat marker" pass "$(grep -m 1 -E "$APP_LOGCAT_MARKER" "$OUT/logcat-app.txt")"
            else check "Logcat marker" fail "/$APP_LOGCAT_MARKER/ not in the app's logcat"; fi
          fi
          echo "::group::App logcat (first 120 lines)"; head -n 120 "$OUT/logcat-app.txt"; echo "::endgroup::"
          # Other processes' ANRs and crashes: not the app's failure, but the usual cause of a covered screen.
          grep -E "ANR in |FATAL EXCEPTION|AndroidRuntime: Process: |Fatal signal|isn't responding|keeps stopping|Showing (crash|ANR) dialog" "$OUT/logcat-full.txt" | grep -v "$PKG_RE" > "$OUT/logcat-system.txt"
          note system_anr_crash_lines "$(wc -l < "$OUT/logcat-system.txt")"
          echo "::group::Other processes: ANR and crash lines (first 30)"; head -n 30 "$OUT/logcat-system.txt"; echo "::endgroup::"
          finish
          SH
      - name: Install, launch and check
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$RUNNER_TEMP/smoke-bin/smoke.sh"
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}-emulator-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn

  ios:
    name: iOS (simulator build check)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'
      - name: Pin Xcode and the iOS workload together
        # Each .NET for iOS release requires one exact Xcode. Workload set 10.0.300 ships iOS 26.2, which requires
        # Xcode 26.3; the hosted image keeps it side by side with its newer default. Bump both together.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          dotnet workload install ios --version 10.0.300
      - name: Build for the simulator (no signing)
        # Store builds need an Apple Developer account, a distribution certificate and a provisioning profile.
        # This job proves the iOS head compiles.
        run: dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -r iossimulator-arm64 -p:QuoteCraftTargetFrameworks=net10.0-ios
