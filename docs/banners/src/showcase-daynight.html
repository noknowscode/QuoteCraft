<!doctype html>
<html><head><meta charset="utf-8"><title>showcase-daynight</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Two tablets, the same moment by day and by night: Kitchen Renovation's preview in Light and in Dark (one session,
     a few seconds apart). The ground turns with them, from warm paper (SecondaryContainer #FEF3C7 on Background
     #F9FAFB) to the night (PrimaryContainer (Dark) #1E3A5F into Background (Dark) #111827). */
  .stage { background:
      linear-gradient(90deg, color-mix(in srgb, #FEF3C7 35%, #F9FAFB) 0%, #F9FAFB 34%, #D6E4F0 49%, #1E3A5F 51%, color-mix(in srgb, #1E3A5F 45%, #111827) 70%, #111827 100%); --grain: .05; }
  .warm { position: absolute; inset: 0; background: radial-gradient(40% 70% at 20% 30%, rgba(254,243,199,.9), rgba(254,243,199,0) 70%); }
  .graph { --cell: 22px; --major: .07; --minor: .03; right: 50%; -webkit-mask-image: radial-gradient(90% 90% at 60% 50%, #000, transparent 90%); }
  .blueprint { --cell: 22px; --major: .10; --minor: .045; left: 50%; -webkit-mask-image: radial-gradient(90% 90% at 40% 50%, #000, transparent 90%); }
  .t { --bezel: 10px; --r: 26px; width: 392px; height: 556px; top: 37px; }
  .t1 { left: 182px; }
  .t2 { left: 626px; }
  .t2 { box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px rgba(0,0,0,.55),
              0 2px 4px rgba(0,0,0,.3), 0 16px 34px -8px rgba(0,0,0,.55), 0 44px 80px -24px rgba(0,0,0,.7); }
</style></head>
<body><div class="stage grain">
  <div class="warm"></div>
  <div class="graph"></div>
  <div class="blueprint"></div>
  <div class="device t t1"><div class="screen"><img src="cap/tab-preview-light@2x.png"></div></div>
  <div class="device t t2"><div class="screen"><img src="cap/tab-preview-dark@2x.png"></div></div>
</div></body></html>
