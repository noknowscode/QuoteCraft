<!doctype html>
<html><head><meta charset="utf-8"><title>focus-quotes</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* The quotes list (Light, one pane at 1060 px): the three stat cards with their sparklines (teal Tertiary, amber
     Secondary, slate Primary), the counts for every status (Draft, Sent, Accepted, Declined, Expired), the filter chips
     and the first quotes with their status pills. Lifted off warm paper and laid back from its bottom edge, which stays
     at native size. Ground: SecondaryContainer #FEF3C7 into Background #F9FAFB and PrimaryContainer #D6E4F0, graph
     lines in Primary #2B4C7E. */
  .stage { background:
      radial-gradient(70% 90% at 12% 10%, #FEF3C7 0%, rgba(254,243,199,0) 75%),
      radial-gradient(60% 80% at 95% 95%, #D6E4F0 0%, rgba(214,228,240,0) 75%),
      linear-gradient(160deg, color-mix(in srgb, #FEF3C7 60%, #F9FAFB) 0%, color-mix(in srgb, #FEF3C7 25%, #F3F4F6) 55%, color-mix(in srgb, #D6E4F0 55%, #F9FAFB) 100%); --grain: .05; }
  .graph { --cell: 22px; --major: .09; --minor: .04; -webkit-mask-image: radial-gradient(80% 90% at 50% 50%, #000, transparent 90%); }
  .glow { position: absolute; left: 190px; right: 190px; top: 520px; height: 110px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(43,76,126,.28), rgba(43,76,126,0)); filter: blur(16px); }
  .panel { position: absolute; left: 162px; top: 82px; width: 876px; height: 494px; border-radius: 16px; overflow: hidden;
    transform-origin: 50% 100%; transform: perspective(1600px) rotateX(16deg);
    box-shadow: 0 0 0 1px rgba(31,41,55,.08), 0 2px 4px rgba(31,41,55,.06), 0 18px 36px -12px rgba(31,41,55,.22), 0 50px 90px -30px rgba(43,76,126,.45); }
  .panel img { position: absolute; left: 0; top: -66px; width: 876px; }
  .panel::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
    background: linear-gradient(180deg, rgba(249,250,251,0), #F9FAFB 92%); }
</style></head>
<body><div class="stage grain">
  <div class="graph"></div>
  <div class="glow"></div>
  <div class="panel"><img src="cap/list-light@3x.png"></div>
</div></body></html>
