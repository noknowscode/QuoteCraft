<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuoteCraft banners</title>
<style>
  :root { --bg: #F9FAFB; --surface: #FFFFFF; --ink: #1F2937; --muted: #5F6673; --line: #E5E7EB; --accent: #2B4C7E; --amber: #F59E0B; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111827; --surface: #1F2937; --ink: #E5E7EB; --muted: #AAB1BD; --line: #374151; --accent: #93B5E1; } }
  :root[data-theme="dark"] { --bg: #111827; --surface: #1F2937; --ink: #E5E7EB; --muted: #AAB1BD; --line: #374151; --accent: #93B5E1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 32px 16px 8px; max-width: 1240px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; } header p { margin: 6px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 24px; padding: 16px; max-width: 1240px; margin: 0 auto; }
  figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 14px 14px; color: var(--muted); font-size: 14px; } figcaption b { color: var(--ink); }
  a { color: var(--accent); } code { font-size: 12px; }
  .pick { background: var(--amber); color: #1A365D; border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 600; }
</style></head>
<body>
<header><h1>QuoteCraft banners</h1><p>11 banners at 1200 × 630 (1x) and 2400 × 1260 (2x), two heroes at 1920 × 1080. Click a banner for 2x. See README.md.</p></header>
<main>
  <figure><a href="finals/showcase-desk@2x.png"><img src="finals/showcase-desk@1x.png" alt="Desk and phones" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Desk and phones</b> <code>showcase-desk</code> · showcase<br>The Quotes page with Kitchen Renovation open in a desktop window, with the quote preview (Dark) and the catalog (Light) on phones, on warm paper.<br>
    <a href="finals/showcase-desk@1x.png">1x</a> · <a href="finals/showcase-desk@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/showcase-phones@2x.png"><img src="finals/showcase-phones@1x.png" alt="Three phones" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Three phones</b> <code>showcase-phones</code> · showcase<br>The quotes list (Dark), the quote preview with its slate band and amber Send Quote (Light, raised) and the catalog (Dark) on a blueprint ground.<br>
    <a href="finals/showcase-phones@1x.png">1x</a> · <a href="finals/showcase-phones@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/showcase-daynight@2x.png"><img src="finals/showcase-daynight@1x.png" alt="Day and night" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Day and night</b> <code>showcase-daynight</code> · showcase<br>Two tablets with Kitchen Renovation&#x27;s preview in Light and in Dark, the ground turning from paper to night.<br>
    <a href="finals/showcase-daynight@1x.png">1x</a> · <a href="finals/showcase-daynight@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/focus-quotes@2x.png"><img src="finals/focus-quotes@1x.png" alt="Quotes and statuses" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Quotes and statuses</b> <code>focus-quotes</code> · focused<br>The stat cards with their sparklines, the count for every status, the filter chips and the first quotes with their status pills, laid back on warm paper.<br>
    <a href="finals/focus-quotes@1x.png">1x</a> · <a href="finals/focus-quotes@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/focus-preview@2x.png"><img src="finals/focus-preview@1x.png" alt="The quote preview" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>The quote preview</b> <span class="pick">pick</span> <code>focus-preview</code> · focused<br>The on-screen preview of QC-2026-0001 with its slate band, line items and total, and the preview&#x27;s Download PDF and amber Send Quote bar.<br>
    <a href="finals/focus-preview@1x.png">1x</a> · <a href="finals/focus-preview@2x.png">2x</a> · <a href="finals/focus-preview-hero.png">hero</a></figcaption></figure>
  <figure><a href="finals/focus-editor@2x.png"><img src="finals/focus-editor@1x.png" alt="Quote editor" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Quote editor</b> <code>focus-editor</code> · focused<br>The editor in Dark: line items with From Catalog and Add Item, subtotal, tax and total, and Add Photo, as a night slab on blueprint.<br>
    <a href="finals/focus-editor@1x.png">1x</a> · <a href="finals/focus-editor@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/focus-catalog@2x.png"><img src="finals/focus-catalog@1x.png" alt="Catalog" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Catalog</b> <code>focus-catalog</code> · focused<br>The seven category tiles in front of Electrical&#x27;s twelve priced items, on cool paper.<br>
    <a href="finals/focus-catalog@1x.png">1x</a> · <a href="finals/focus-catalog@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/stylized-split@2x.png"><img src="finals/stylized-split@1x.png" alt="Light and Dark split" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Light and Dark split</b> <span class="pick">pick</span> <code>stylized-split</code> · stylized<br>One Quotes page in Light and Dark on a turned plane, cut by a single diagonal in the app&#x27;s amber rule.<br>
    <a href="finals/stylized-split@1x.png">1x</a> · <a href="finals/stylized-split@2x.png">2x</a> · <a href="finals/stylized-split-hero.png">hero</a></figcaption></figure>
  <figure><a href="finals/stylized-sheets@2x.png"><img src="finals/stylized-sheets@1x.png" alt="Quote sheets" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Quote sheets</b> <code>stylized-sheets</code> · stylized<br>Five of the seeded quotes as the app previews them, dealt across a blueprint table, Kitchen Renovation on top.<br>
    <a href="finals/stylized-sheets@1x.png">1x</a> · <a href="finals/stylized-sheets@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/stylized-mosaic@2x.png"><img src="finals/stylized-mosaic@1x.png" alt="Element wall" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Element wall</b> <code>stylized-mosaic</code> · stylized<br>A tilted wall of whole elements, Light and Dark alternating: stat cards, status chips, quote cards, line items, totals, catalog tiles and New Quote.<br>
    <a href="finals/stylized-mosaic@1x.png">1x</a> · <a href="finals/stylized-mosaic@2x.png">2x</a></figcaption></figure>
  <figure><a href="finals/focus-preview-titled@2x.png"><img src="finals/focus-preview-titled@1x.png" alt="Preview, titled" loading="lazy" width="1200" height="630"></a>
    <figcaption><b>Preview, titled</b> <code>focus-preview-titled</code> · titled<br>The quote preview banner with the QuoteCraft name in DM Sans Bold over an amber rule (optional).<br>
    <a href="finals/focus-preview-titled@1x.png">1x</a> · <a href="finals/focus-preview-titled@2x.png">2x</a></figcaption></figure>
</main>
</body></html>
